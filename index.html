<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On The Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: a sharp trader's desk, quick and confident.
IDEA: the auction block, players under a hammer, a ticker of who's buying.
PICTURE: offer cards: you give vs you get, set like a trade slip.
COLOUR and TYPE: deep turf green, chalk white, hammer orange accent; Barlow Condensed + Inter.
LAYOUT: sticky top bar with tabs, one column of cards, stacks on phone.
*/
:root{color-scheme:light dark;
--turf:#0d3b2c;--turf2:#14523d;--chalk:#f6f5ef;--ink:light-dark(#14201b,#eef2ee);--muted:light-dark(#5b6b63,#a3b3aa);
--bg:light-dark(#f1f2ec,#0b1512);--card:light-dark(#ffffff,#13211c);--line:light-dark(#dfe3da,#22362e);
--hammer:#ff6a2b;--good:light-dark(#11804f,#43c98a);--warn:light-dark(#b25b00,#ffb066);--bad:light-dark(#b3261e,#ff8a80)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.01em}
button,input,select{font:inherit}
.top{background:var(--turf);color:var(--chalk);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px) 8px;flex-wrap:wrap}
.brand{font:800 26px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin:0}
.brand b{background:var(--hammer);color:#fff;padding:2px 6px;border-radius:4px}
.who{margin-left:auto;display:flex;gap:6px}
.who input{width:150px;padding:8px 10px;border-radius:8px;border:1px solid #ffffff40;background:#ffffff14;color:var(--chalk);font-size:16px}
.btn{min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
.btn.hot{background:var(--hammer);border-color:var(--hammer);color:#fff}
.btn.ghost{background:transparent;color:inherit;border-color:#ffffff40}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hammer);outline-offset:2px}
nav{display:flex;gap:2px;padding:0 max(4vw,14px);overflow-x:auto}
nav a{color:#ffffffb3;text-decoration:none;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current=page]{color:#fff;border-color:var(--hammer)}
.status{font-size:12.5px;color:#ffffffa6;padding:0 max(4vw,14px) 8px}
main{max-width:880px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h2{font-size:30px;line-height:1.05;margin:4px 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.nowrap{flex-wrap:nowrap}.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:light-dark(#eef0ea,#1c2e27);color:var(--muted);white-space:nowrap}
.pill.hot{background:var(--hammer);color:#fff}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.pos{display:inline-block;min-width:30px;text-align:center;font:700 12px/18px Inter;border-radius:4px;color:#fff;padding:0 4px}
.QB{background:#c2410c}.RB{background:#15803d}.WR{background:#1d4ed8}.TE{background:#7e22ce}.PICK{background:#57534e}
.player{font:700 22px/1.1 "Barlow Condensed",sans-serif}
.big{font:800 34px/1 "Barlow Condensed",sans-serif}
.up{color:var(--good)}.down{color:var(--bad)}
.slip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.side{border-radius:10px;padding:10px;background:light-dark(#f6f7f2,#0f1c17)}
.side h4{margin:0 0 6px;font:600 12.5px Inter;color:var(--muted)}
.asset{display:flex;gap:6px;align-items:baseline;padding:2px 0}
.asset .v{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.buyer{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.buyer:first-of-type{border-top:0;margin-top:0;padding-top:0}
.muted{color:var(--muted)}.small{font-size:13px}
label.chk{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-height:40px}
input[type=search],select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.picker{position:relative}
.opts{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;box-shadow:0 10px 30px #0003}
.opts button{display:flex;width:100%;gap:8px;align-items:center;padding:10px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;min-height:44px}
.opts button:hover,.opts button:focus{background:light-dark(#f1f2ec,#1c2e27)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12.5px}
.empty{text-align:center;padding:36px 14px;color:var(--muted)}
.empty .big{color:var(--ink);display:block;margin-bottom:6px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.spark{width:96px;height:28px}
@media(max-width:600px){.slip{grid-template-columns:1fr}.who{margin-left:0;width:100%}.who input{flex:1;width:auto}.brand{font-size:22px}h2{font-size:26px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out both}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand">On The <b>Block</b></h1>
    <form class="who" id="who">
      <input id="username" placeholder="Sleeper username" autocomplete="username" aria-label="Sleeper username">
      <button class="btn hot" type="submit">Load</button>
    </form>
  </div>
  <nav id="tabs">
    <a href="#board">Board</a><a href="#shop">Shop</a><a href="#list">Sell list</a><a href="#leagues">Leagues</a>
  </nav>
  <div class="status" id="status">Enter your Sleeper username to load your dynasty leagues.</div>
</header>
<main id="view"></main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
