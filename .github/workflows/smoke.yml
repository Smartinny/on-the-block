name: Smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "scripts/smoke.mjs", ".github/workflows/smoke.yml"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node scripts/smoke.mjs Smartinny "Justin Jefferson"
